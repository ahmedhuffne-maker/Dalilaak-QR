<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />
  
  <!-- Subtle Amber Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#amberGlow)" filter="blur(30px)" />

  <!-- Inner Golden Shield/Frame Accent -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- Main Glowing Center Symbol: QR & 5 Stars & Sparkle -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- QR Corner Matrix Markers -->
    <!-- Top-Left Target -->
    <rect x="20" y="20" width="80" height="80" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
    <rect x="42" y="42" width="36" height="36" rx="8" fill="url(#goldGrad)" />
    
    <!-- Top-Right Target -->
    <rect x="200" y="20" width="80" height="80" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
    <rect x="222" y="42" width="36" height="36" rx="8" fill="url(#goldGrad)" />
    
    <!-- Bottom-Left Target -->
    <rect x="20" y="200" width="80" height="80" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
    <rect x="42" y="222" width="36" height="36" rx="8" fill="url(#goldGrad)" />

    <!-- Center Big Star (Representing 5-Star Reviews) -->
    <path d="M 240 180 L 252 214 L 288 214 L 259 235 L 270 269 L 240 248 L 210 269 L 221 235 L 192 214 L 228 214 Z" 
          fill="url(#goldGrad)" transform="translate(-90, -40) scale(1.3)" />

    <!-- Micro Data Dots -->
    <circle cx="150" cy="60" r="10" fill="url(#goldGrad)" />
    <circle cx="60" cy="150" r="10" fill="url(#goldGrad)" />
    <circle cx="240" cy="240" r="12" fill="url(#goldGrad)" />
    <circle cx="150" cy="240" r="10" fill="url(#goldGrad)" />
    <circle cx="240" cy="150" r="10" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom 5 Golden Mini Stars Badge -->
  <g transform="translate(146, 420)">
    <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#fbbf24" transform="scale(1.2)" />
    <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#fbbf24" transform="translate(42, 0) scale(1.2)" />
    <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#fbbf24" transform="translate(84, 0) scale(1.2)" />
    <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#fbbf24" transform="translate(126, 0) scale(1.2)" />
    <polygon points="12,2 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="#fbbf24" transform="translate(168, 0) scale(1.2)" />
  </g>
</svg>
